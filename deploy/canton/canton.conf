// ============================================================================
// AryaFi Canton Network Topology Configuration
// Multi-Participant Institutional Test Topology — Canton 3.5 (open source)
//
// Matches Daml SDK 3.5 (daml.yaml). One synchronizer (sequencer + mediator)
// and one participant node per institution. The synchronizer and its protocol
// version are created by deploy/docker/bootstrap.sh.
// Storage is in-memory: this topology is for local integration testing only.
// ============================================================================

canton {

  // --------------------------------------------------------------------------
  // Synchronizer nodes: orders and delivers messages between participants
  // (sequencer) and confirms transactions (mediator).
  // --------------------------------------------------------------------------
  sequencers {
    aryafi_sequencer {
      storage.type = memory
      sequencer.type = BFT
      public-api {
        address = "0.0.0.0"
        port = 5018
      }
      admin-api {
        address = "0.0.0.0"
        port = 5019
      }
    }
  }

  mediators {
    aryafi_mediator {
      storage.type = memory
      admin-api {
        address = "0.0.0.0"
        port = 5020
      }
    }
  }

  // --------------------------------------------------------------------------
  // Institutional Participant Nodes — one per organization, so each party's
  // contracts are stored only on the nodes of the parties that are stakeholders.
  // Each node exposes the gRPC Ledger API (xxx2) and the JSON Ledger API (xxx3).
  // --------------------------------------------------------------------------
  participants {

    // 1. Cash settlement bank (tokenized deposits / central bank money)
    bank_node {
      storage.type = memory
      admin-api {
        address = "0.0.0.0"
        port = 10011
      }
      ledger-api {
        address = "0.0.0.0"
        port = 10012
      }
      http-ledger-api {
        address = "0.0.0.0"
        port = 10013
      }
    }

    // 2. Global custodian / settlement agent
    custodian_node {
      storage.type = memory
      admin-api {
        address = "0.0.0.0"
        port = 10021
      }
      ledger-api {
        address = "0.0.0.0"
        port = 10022
      }
      http-ledger-api {
        address = "0.0.0.0"
        port = 10023
      }
    }

    // 3. Dealer A (seller side)
    dealer_a_node {
      storage.type = memory
      admin-api {
        address = "0.0.0.0"
        port = 10031
      }
      ledger-api {
        address = "0.0.0.0"
        port = 10032
      }
      http-ledger-api {
        address = "0.0.0.0"
        port = 10033
      }
    }

    // 4. Dealer B (buyer side)
    dealer_b_node {
      storage.type = memory
      admin-api {
        address = "0.0.0.0"
        port = 10041
      }
      ledger-api {
        address = "0.0.0.0"
        port = 10042
      }
      http-ledger-api {
        address = "0.0.0.0"
        port = 10043
      }
    }

    // 5. Supervisory authority (observer)
    regulator_node {
      storage.type = memory
      admin-api {
        address = "0.0.0.0"
        port = 10051
      }
      ledger-api {
        address = "0.0.0.0"
        port = 10052
      }
      http-ledger-api {
        address = "0.0.0.0"
        port = 10053
      }
    }
  }
}
