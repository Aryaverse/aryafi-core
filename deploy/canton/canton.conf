// ============================================================================
// AryaFi Canton Network Topology Configuration
// Multi-Participant Institutional Test Topology — Canton 2.10 (open source)
//
// Matches Daml SDK 2.10.0 (daml.yaml). Canton 2.10 supports stable protocol
// versions 5 and 7; the domain must declare one explicitly.
// Storage is in-memory: this topology is for local integration testing only.
// ============================================================================

canton {

  // --------------------------------------------------------------------------
  // Synchronization Domain (sequencer + mediator + topology manager)
  // --------------------------------------------------------------------------
  domains {
    aryafi_domain {
      init.domain-parameters.protocol-version = 5
      storage.type = memory
      public-api {
        address = "0.0.0.0"
        port = 5018
      }
      admin-api {
        address = "0.0.0.0"
        port = 5019
      }
    }
  }

  // --------------------------------------------------------------------------
  // Institutional Participant Nodes — one per organization, so each party's
  // contracts are stored only on the nodes of the parties that are stakeholders.
  // --------------------------------------------------------------------------
  participants {

    // 1. Cash settlement bank (tokenized deposits / central bank money)
    bank_node {
      storage.type = memory
      admin-api {
        address = "0.0.0.0"
        port = 10011
      }
      ledger-api {
        address = "0.0.0.0"
        port = 10012
      }
    }

    // 2. Global custodian / settlement agent
    custodian_node {
      storage.type = memory
      admin-api {
        address = "0.0.0.0"
        port = 10021
      }
      ledger-api {
        address = "0.0.0.0"
        port = 10022
      }
    }

    // 3. Dealer A (seller side)
    dealer_a_node {
      storage.type = memory
      admin-api {
        address = "0.0.0.0"
        port = 10031
      }
      ledger-api {
        address = "0.0.0.0"
        port = 10032
      }
    }

    // 4. Dealer B (buyer side)
    dealer_b_node {
      storage.type = memory
      admin-api {
        address = "0.0.0.0"
        port = 10041
      }
      ledger-api {
        address = "0.0.0.0"
        port = 10042
      }
    }

    // 5. Supervisory authority (observer)
    regulator_node {
      storage.type = memory
      admin-api {
        address = "0.0.0.0"
        port = 10051
      }
      ledger-api {
        address = "0.0.0.0"
        port = 10052
      }
    }
  }

  // Console commands used by the bootstrap script (party allocation, DAR upload).
  features.enable-testing-commands = yes
}
