// ============================================================================
// AryaFi Canton Network Topology Configuration
// Multi-Participant Institutional Deployment Specification (v1.0.0)
// ============================================================================

canton {

  // --------------------------------------------------------------------------
  // Global Domain Configuration
  // --------------------------------------------------------------------------
  domains {
    aryafi_domain {
      storage {
        type = memory
      }
      
      init {
        domain-parameters {
          protocol-version = 30
          confirmation-response-timeout = 30s
          mediator-reaction-timeout = 30s
          assignment-timeout = 30s
          ledger-time-record-time-tolerance = 1m
        }
      }

      public-api {
        address = "0.0.0.0"
        port = 5018
      }

      admin-api {
        address = "0.0.0.0"
        port = 5019
      }
    }
  }

  // --------------------------------------------------------------------------
  // Institutional Participant Nodes
  // --------------------------------------------------------------------------
  participants {

    // 1. Central Cash Authority / Settlement Bank Node
    bank_node {
      storage {
        type = memory
      }
      admin-api {
        address = "0.0.0.0"
        port = 10011
      }
      ledger-api {
        address = "0.0.0.0"
        port = 10012
        postgres-data-source-class = null
      }
      parameters {
        initial-protocol-version = 30
      }
    }

    // 2. Global Custodian / Central Securities Depository Node
    custodian_node {
      storage {
        type = memory
      }
      admin-api {
        address = "0.0.0.0"
        port = 10021
      }
      ledger-api {
        address = "0.0.0.0"
        port = 10022
      }
      parameters {
        initial-protocol-version = 30
      }
    }

    // 3. Primary Dealer A (Broker-Dealer / Market Maker) Node
    dealer_a_node {
      storage {
        type = memory
      }
      admin-api {
        address = "0.0.0.0"
        port = 10031
      }
      ledger-api {
        address = "0.0.0.0"
        port = 10032
      }
      parameters {
        initial-protocol-version = 30
      }
    }

    // 4. Primary Dealer B (Institutional Asset Manager / Counterparty) Node
    dealer_b_node {
      storage {
        type = memory
      }
      admin-api {
        address = "0.0.0.0"
        port = 10041
      }
      ledger-api {
        address = "0.0.0.0"
        port = 10042
      }
      parameters {
        initial-protocol-version = 30
      }
    }

    // 5. Regulatory Authority & Supervisory Observer Node
    regulator_node {
      storage {
        type = memory
      }
      admin-api {
        address = "0.0.0.0"
        port = 10051
      }
      ledger-api {
        address = "0.0.0.0"
        port = 10052
      }
      parameters {
        initial-protocol-version = 30
      }
    }
  }

  // --------------------------------------------------------------------------
  // Feature Flags and Monitoring
  // --------------------------------------------------------------------------
  features {
    enable-testing-commands = yes
    enable-preview-commands = yes
  }

  monitoring {
    logging {
      api {
        max-message-lines = 500
      }
    }
  }
}
