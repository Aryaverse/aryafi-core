sdk-version: 3.5.12
name: aryafi-core
source: daml/src
version: 3.2.0
dependencies:
  - daml-prim
  - daml-stdlib
data-dependencies:
  # Canton Network Token Standard interfaces (CIP-56 V1 and CIP-0112 V2),
  # vendored from Splice 0.8.3 (daml/dars in canton-network/splice).
  - daml/deps/splice/splice-api-token-metadata-v1-1.0.0.dar
  - daml/deps/splice/splice-api-token-holding-v1-1.0.0.dar
  - daml/deps/splice/splice-api-token-holding-v2-1.0.0.dar
  - daml/deps/splice/splice-api-token-transfer-instruction-v2-1.0.0.dar
build-options:
  - --ghc-option=-Wall
  - --ghc-option=-Werror
