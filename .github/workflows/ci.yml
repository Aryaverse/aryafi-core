name: AryaFi Core CI

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main", "develop" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Daml SDK
        run: |
          curl -sSL https://get.daml.com/ | sh
          echo "$HOME/.daml/bin" >> $GITHUB_PATH

      - name: Check Daml Version
        run: daml version

      - name: Build Daml Archive (DAR)
        run: daml build

      - name: Run Daml Tests
        run: daml test
