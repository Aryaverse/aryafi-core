name: AryaFi Core Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release-dar:
    name: Build and Publish Daml Release Artifacts
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java (required by the Daml Script test runner)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # Exact-version cache key only: restoring a different SDK version would
      # silently build against the wrong compiler.
      - name: Cache Daml SDK
        uses: actions/cache@v4
        with:
          path: ~/.daml
          key: daml-sdk-${{ runner.os }}-2.10.0

      - name: Install Daml SDK
        run: |
          if ! "$HOME/.daml/bin/daml" version 2>/dev/null | grep -q "2.10.0"; then
            curl -sSL https://get.daml.com/ | sh -s 2.10.0
          fi
          echo "$HOME/.daml/bin" >> $GITHUB_PATH

      - name: Execute Full Test Suite (release gate)
        run: daml test

      - name: Compile Release DAR
        run: |
          daml build
          mkdir -p release-artifacts
          cp .daml/dist/*.dar release-artifacts/

      - name: Generate Cryptographic Checksums
        working-directory: release-artifacts
        run: |
          for f in *.dar; do
            sha256sum "$f" > "${f}.sha256"
          done
          ls -la

      - name: Create GitHub Release & Upload Assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release-artifacts/*.dar
            release-artifacts/*.sha256
          generate_release_notes: true
          draft: false
          prerelease: false
