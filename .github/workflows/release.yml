name: AryaFi Core Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

env:
  # Keep in step with sdk-version in daml.yaml and daml/test/daml.yaml.
  DPM_SDK_VERSION: "3.5.12"

jobs:
  release-dar:
    name: Build and Publish Daml Release Artifacts
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # The release notes are the CHANGELOG.md section for this version, with
      # relative links made absolute (they would break on the release page).
      # Runs first so a release without a CHANGELOG entry fails before building.
      - name: Extract Release Notes from CHANGELOG
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          BLOB="https://github.com/${GITHUB_REPOSITORY}/blob/${GITHUB_REF_NAME}"
          awk -v v="$VERSION" '
            index($0, "## [" v "]") == 1 { found = 1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md \
            | sed -E -e '/^---$/d' \
                     -e "s#\]\(((docs|deploy|examples|daml|scripts)/[^)]*|[A-Z_]+\.md[^)]*)\)#](${BLOB}/\1)#g" \
            > release-notes.md
          if ! grep -q '[^[:space:]]' release-notes.md; then
            echo "CHANGELOG.md has no entry for $VERSION"; exit 1
          fi

      - name: Set up Java (required by the Daml Script test runner)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      # Exact-version cache key only: restoring a different SDK version would
      # silently build against the wrong compiler.
      - name: Cache Daml SDK
        uses: actions/cache@v4
        with:
          path: ~/.dpm
          key: dpm-sdk-${{ runner.os }}-${{ env.DPM_SDK_VERSION }}

      - name: Install Daml SDK
        run: |
          if ! "$HOME/.dpm/bin/dpm" version 2>/dev/null | grep -q "$DPM_SDK_VERSION"; then
            curl -sSL https://get.digitalasset.com/install/install.sh | sh -s "$DPM_SDK_VERSION"
          fi
          echo "$HOME/.dpm/bin" >> $GITHUB_PATH

      - name: Compile Daml Archives (DARs)
        run: dpm build --all

      - name: Execute Full Test Suite (release gate)
        working-directory: daml/test
        run: dpm test

      # Only the production package is released; the test package stays in CI.
      - name: Collect Release DAR
        run: |
          mkdir -p release-artifacts
          cp .daml/dist/aryafi-core-*.dar release-artifacts/

      - name: Generate Cryptographic Checksums
        working-directory: release-artifacts
        run: |
          for f in *.dar; do
            sha256sum "$f" > "${f}.sha256"
          done
          ls -la

      - name: Create GitHub Release & Upload Assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release-artifacts/*.dar
            release-artifacts/*.sha256
          body_path: release-notes.md
          draft: false
          prerelease: false
